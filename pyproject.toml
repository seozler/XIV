[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reference-analyzer"
version = "0.1.0"
description = "Reference Video Reverse Analysis System: measures animation, typography, audio, narration and sync from reference videos and compares them with an existing video-generation system."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "opencv-python-headless>=4.9",
  "soundfile>=0.12",
  "librosa>=0.10",
  "requests>=2.31",
]

[project.optional-dependencies]
ocr = ["rapidocr_onnxruntime>=1.3"]
paddle = ["paddleocr>=2.7"]
prosody = ["praat-parselmouth>=0.4"]
scenes = ["scenedetect>=0.6"]
llm = ["anthropic>=1.0"]
storage = ["boto3>=1.34"]
postgres = ["psycopg[binary]>=3.1"]
local-asr = ["faster-whisper>=1.0"]
full = [
  "rapidocr_onnxruntime>=1.3",
  "praat-parselmouth>=0.4",
  "scenedetect>=0.6",
  "anthropic>=1.0",
]
dev = ["pytest>=8"]

[project.scripts]
reference-analyzer = "refanalyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
refanalyzer = ["*.sql", "*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
